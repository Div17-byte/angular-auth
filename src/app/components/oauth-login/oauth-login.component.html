<div class="oauth-login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>OAuth 2.0 Login</h1>
      <p class="subtitle">Securely authenticate using OAuth 2.0</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error]="
            loginForm.get('email')?.touched &&
            loginForm.get('email')?.hasError('required')
          "
        />
        <span
          *ngIf="
            loginForm.get('email')?.touched &&
            loginForm.get('email')?.hasError('required')
          "
          class="error-msg"
        >
          Email is required
        </span>
        <span
          *ngIf="
            loginForm.get('email')?.touched &&
            loginForm.get('email')?.hasError('email')
          "
          class="error-msg"
        >
          Please enter a valid email
        </span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Enter your password"
            [class.error]="
              loginForm.get('password')?.touched &&
              loginForm.get('password')?.hasError('required')
            "
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
          >
            {{ showPassword ? "👁️" : "👁️‍🗨️" }}
          </button>
        </div>
        <span
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.hasError('required')
          "
          class="error-msg"
        >
          Password is required
        </span>
        <span
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.hasError('minlength')
          "
          class="error-msg"
        >
          Password must be at least 6 characters
        </span>
      </div>

      <div *ngIf="errorMsg" class="alert error">
        {{ errorMsg }}
      </div>

      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading || loginForm.invalid"
      >
        <span *ngIf="!isLoading">Login with OAuth 2.0</span>
        <span *ngIf="isLoading" class="loading">
          <span class="spinner"></span>
          Authenticating...
        </span>
      </button>
    </form>

    <div class="login-footer">
      <p>
        Or use
        <a routerLink="/">Regular Login</a>
      </p>
    </div>
  </div>
</div>
